workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - security
  - quality
  - test
  - build

default:
  image: node:24-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - ${STACK_DIR}/.npm/

variables:
  GIT_DEPTH: '0'

.node-job:
  before_script:
    - cd "$STACK_DIR"
    - npm ci --cache .npm --prefer-offline

.secret-scan-template:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: ['']
  before_script:
    - cd "$STACK_DIR"
  script:
    - gitleaks git --config .gitleaks.toml --redact --verbose "$CI_PROJECT_DIR"

.dependency-audit-template:
  extends: .node-job
  stage: security
  script:
    - npm audit --audit-level=high

.quality-template:
  extends: .node-job
  stage: quality
  script:
    - npm run quality

.commitlint-template:
  extends: .node-job
  stage: quality
  before_script:
    - apk add --no-cache git
    - cd "$STACK_DIR"
    - npm ci --cache .npm --prefer-offline
  script:
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        npx --no -- commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA" --verbose
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        npx --no -- commitlint --from "$CI_COMMIT_BEFORE_SHA" --to "$CI_COMMIT_SHA" --verbose
      elif [ "${CI_PIPELINE_SOURCE:-}" = "push" ] && [ -n "${CI_COMMIT_BRANCH:-}" ] && [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        for COMMIT_SHA in $(git rev-list --topo-order --reverse "$CI_COMMIT_SHA"); do
          git log -1 --format=%B "$COMMIT_SHA" | npx --no -- commitlint --verbose || exit 1
        done
      else
        git fetch origin "$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
        BASE_SHA="$(git merge-base "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH")"
        if [ "$BASE_SHA" = "$CI_COMMIT_SHA" ]; then
          git log -1 --format=%B "$CI_COMMIT_SHA" | npx --no -- commitlint --verbose
        else
          npx --no -- commitlint --from "$BASE_SHA" --to "$CI_COMMIT_SHA" --verbose
        fi
      fi

.test-template:
  extends: .node-job
  stage: test
  script:
    - npm test

.build-template:
  extends: .node-job
  stage: build
  script:
    - npm run build
