<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Aura - thoughtfully curated electronics, fashion, beauty and home goods."
    />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <!-- Open the API connection while the app's JavaScript downloads. Requests send cookies. -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin="use-credentials" />
    <link rel="preconnect" href="https://cdn.dummyjson.com" />
    <title>Aura - Curated goods</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('aura-theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static shell: paints as soon as the stylesheet arrives, then React replaces it. -->
      <div class="app-shell" aria-hidden="true">
        <div class="app-shell-bar"></div>
        <div class="container-page app-shell-header">
          <span class="app-shell-menu"></span>
          <span class="app-shell-mark">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M6 18 12 5l6 13M8.4 13.5h7.2"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="app-shell-name">Aura</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
