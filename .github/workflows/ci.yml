# Mirrors the WebVoltz shared pipeline (common/gitlab/quality.yml) on GitHub Actions:
# security → quality → test → build, run once from the monorepo root.
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  quality:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run quality

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            npx --no -- commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            npx --no -- commitlint --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          else
            # First push, tag, or manual run: lint everything after the default branch's merge base,
            # or the whole history when this is the default branch itself.
            BASE="$(git merge-base "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" 2>/dev/null || true)"
            if [ -z "$BASE" ] || [ "$BASE" = "$GITHUB_SHA" ]; then
              for COMMIT in $(git rev-list --reverse "$GITHUB_SHA"); do
                git log -1 --format=%B "$COMMIT" | npx --no -- commitlint --verbose || exit 1
              done
            else
              npx --no -- commitlint --from "$BASE" --to "$GITHUB_SHA" --verbose
            fi
          fi

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests use the DATABASE_URL database with `_test` appended.
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-dist
          path: apps/web/dist
          retention-days: 7
